[project]
name = "x-mcp"
version = "0.1.0"
description = "Read X/Twitter without an account via public Nitter mirrors: CLI + MCP server"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "mcp>=1.0",
]

[project.scripts]
x-cli = "xmcp.cli:main"
x-mcp = "xmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
